<style>
/* Layout: pit-wall de F1. Cabecera fija con semáforo de 10 luces, pestañas por vuelta, una vuelta por pantalla. Identidad BullsEye, un solo tema oscuro. */
:root{
  --bg:#140F3D; --s1:#1E1760; --s2:#2A2180; --line:#3A3196;
  --fg:#F3F1FF; --mute:#B9B3E6;
  --cyan:#62E0D8; --purple:#9B4FC0; --magenta:#E0457B;
  --ok:#62E0D8; --warn:#F2C14E; --bad:#E0457B;
  --display:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
a{color:var(--cyan)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:14px 10px;display:grid;gap:10px}
.brandrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:clamp(20px,3.2vw,26px);font-weight:800;letter-spacing:-.01em}
.brand .tag{font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.lights{display:flex;align-items:center;gap:6px}
.light{width:14px;height:14px;border-radius:50%;background:var(--s2);border:1px solid var(--line);transition:background .3s,box-shadow .3s}
.light.on{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.light.on.last{background:var(--magenta);box-shadow:0 0 10px var(--magenta)}
.lap-count{font-family:var(--display);font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;margin-left:6px;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--s1);color:var(--mute);border-radius:999px;padding:6px 12px;font-family:var(--display);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.tab .n{font-variant-numeric:tabular-nums;color:var(--fg)}
.tab.done .n{color:var(--cyan)}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab[aria-selected="true"] .n{color:var(--bg)}

main .wrap{padding-block:28px 64px}
.lap-head{display:grid;gap:8px;margin-bottom:22px}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--purple);font-weight:700}
.lap-head h2{font-size:clamp(26px,4.4vw,40px);font-weight:800;letter-spacing:-.02em}
.lead{color:var(--mute);font-size:18px;max-width:65ch}
section.lap{display:grid;gap:22px}
.block{display:grid;gap:12px;min-width:0}
.block h3{font-size:19px;font-weight:700}
.block p,.block li{max-width:68ch}
.block ul,.block ol{margin:0;padding-left:20px;display:grid;gap:6px}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-family:var(--display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);background:var(--s1);font-weight:600}
tr:last-child td{border-bottom:0}
.remember{border:1px solid var(--cyan);background:color-mix(in srgb,var(--cyan) 10%,var(--bg));border-radius:12px;padding:14px 16px;display:grid;gap:4px}
.remember b{font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.chip{display:inline-block;border:1px solid var(--line);background:var(--s2);border-radius:999px;padding:2px 10px;font-size:13px;color:var(--fg)}
.stat{display:grid;gap:2px}
.stat .v{font-family:var(--display);font-size:30px;font-weight:800;color:var(--cyan);font-variant-numeric:tabular-nums}
.stat .k{color:var(--mute);font-size:14px}
.btn{border:1px solid var(--line);background:var(--s2);border-radius:10px;padding:9px 14px;font-weight:500}
.btn:hover{border-color:var(--cyan)}
.btn.primary{background:var(--cyan);color:var(--bg);border-color:var(--cyan);font-family:var(--display);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.finish{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:20px;margin-top:6px}
.finish .msg{color:var(--mute);font-size:14px}
.warnbox{border-left:3px solid var(--magenta);padding:4px 0 4px 12px;color:var(--fg)}

/* Selector de servicios */
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1px solid var(--line);background:var(--s1);border-radius:10px;padding:8px 12px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:#fff}
.svc{display:grid;gap:10px}
.svc dl{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;margin:0}
.svc dt{font-family:var(--display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding-top:3px}
.svc dd{margin:0;min-width:0}
@media (max-width:560px){.svc dl{grid-template-columns:1fr}.svc dt{padding-top:6px}}

/* Flip cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.flip{perspective:900px;border:0;background:none;padding:0;text-align:left;min-height:170px}
.flip .in{position:relative;width:100%;height:100%;min-height:170px;transition:transform .5s;transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;border:1px solid var(--line);padding:14px;display:grid;align-content:space-between;gap:8px;overflow:auto}
.front{background:var(--s1)}
.front .w{font-family:var(--display);font-size:18px;font-weight:700}
.front .hint{font-size:12px;color:var(--mute)}
.back{background:var(--s2);transform:rotateY(180deg);font-size:14px}
.back .why{color:var(--cyan);font-size:13px}
.filter{display:flex;gap:8px;flex-wrap:wrap}

/* Builder */
.builder{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.builder{grid-template-columns:1fr}}
.piece{display:grid;gap:6px}
.piece label{font-family:var(--display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.piece label span{color:var(--cyan)}
select,textarea{width:100%;background:var(--s1);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;font-size:15px}
textarea{min-height:220px;resize:vertical;line-height:1.5}
.meter{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.bar{flex:1;height:8px;border-radius:4px;background:var(--s2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--cyan);width:0;transition:width .2s,background .2s}
.bar.over i{background:var(--magenta)}

/* Objeciones */
.obj-list{display:flex;flex-wrap:wrap;gap:8px}
.obj-list button{border:1px solid var(--line);background:var(--s1);border-radius:999px;padding:7px 12px;font-size:14px}
.obj-list button[aria-pressed="true"]{border-color:var(--magenta);background:color-mix(in srgb,var(--magenta) 22%,var(--s1))}
.sim{display:grid;gap:12px}
.bubble{background:var(--s2);border-radius:14px 14px 14px 4px;padding:12px 14px;max-width:560px;font-size:17px}
.reveal{display:grid;gap:10px}
.reveal .lbl{font-family:var(--display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.answer{border-left:3px solid var(--cyan);padding-left:12px}

/* Checklist */
.check{display:grid;gap:10px}
.check label{display:flex;gap:12px;align-items:flex-start;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--cyan);margin-top:2px;flex:0 0 auto}
.verdict{border-radius:12px;padding:14px 16px;font-weight:500;border:1px solid var(--line)}
.verdict.go{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--bg))}
.verdict.mid{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--bg))}
.verdict.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--bg))}

/* Quiz */
.q{display:grid;gap:10px}
.q .qn{font-family:var(--display);font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.q h3{font-size:20px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--s1);border-radius:10px;padding:10px 14px}
.opt:hover:not([disabled]){border-color:var(--cyan)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--s1))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--s1))}
.opt[disabled]{cursor:default}
.qprog{display:flex;gap:4px}
.qprog i{flex:1;height:6px;border-radius:3px;background:var(--s2)}
.qprog i.r{background:var(--ok)}.qprog i.w{background:var(--bad)}
.score{font-family:var(--display);font-size:44px;font-weight:800;font-variant-numeric:tabular-nums}

.case-out{display:grid;gap:8px}
.case-out .name{font-family:var(--display);font-size:22px;font-weight:700}
.quote{font-size:17px;border-left:3px solid var(--purple);padding-left:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:500;font-size:14px;z-index:20}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1800)}
function copyText(text,fallbackEl){
  const ok=()=>toast("Copiado");
  try{navigator.clipboard.writeText(text).then(ok,()=>{selectEl(fallbackEl)})}catch(e){selectEl(fallbackEl)}
}
function selectEl(el){if(!el)return;if(el.select){el.focus();el.select()}else{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast("Texto seleccionado: cópialo con Ctrl/Cmd + C")}

["4 · vie 30 oct (mañana)","Vuelta 9","Roleplay de objeciones (precio, «ya tenemos equipo», «mándame info») y aprueba el quiz"],
["5 · vie 30 oct y lun 2 nov","Todo","Primeros llamados y primera secuencia de 15 días. Al cerrar, anota qué objeciones escuchaste"]])}</div>
<div class="block"><h3>Quiz final · apruebas con 8 de 10</h3><div class="panel" id="quiz"></div></div>
${remember("Practica en voz alta antes de llamar. El quiz se aprueba con 8 de 10.")}`
];

/* ---------- interactivos ---------- */
const MOUNT={
 2(){const seg=$("#svcSeg"),out=$("#svcOut");
  const show=k=>{const s=SERVICES[k];out.innerHTML=`<span class="chip">${s.line}</span><h3>${s.name}</h3><dl><dt>Analogía</dt><dd>${s.analogy}</dd><dt>En la empresa</dt><dd>${s.means}</dd><dt>Dolor que abre</dt><dd>${s.pain}</dd><dt>Ejemplo</dt><dd>${s.example}</dd></dl>`;
   seg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===k))};
  seg.addEventListener("click",e=>{const b=e.target.closest("button");if(b)show(b.dataset.k)});show("staffing")},
 3(){const seg=$("#dictSeg"),box=$("#cards");
  const draw=f=>{box.innerHTML=DICT.filter(d=>f==="all"||d[0]===f).map(d=>`<button type="button" class="flip" aria-label="${esc(d[1])}: ver significado"><div class="in"><div class="face front"><span class="chip">${d[0]==="rol"?"Rol":"Palabra"}</span><span class="w">${esc(d[1])}</span><span class="hint">Toca para dar vuelta</span></div><div class="face back"><p>${esc(d[2])}</p><p class="why"><b>Para vender:</b> ${esc(d[3])}</p></div></div></button>`).join("");
   seg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===f))};
  seg.addEventListener("click",e=>{const b=e.target.closest("button");if(b)draw(b.dataset.f)});
  box.addEventListener("click",e=>{const c=e.target.closest(".flip");if(c)c.classList.toggle("open")});draw("all")},
 6(){const sel=$("#caseSel"),out=$("#caseOut");
  const show=()=>{const c=CASES[sel.value];out.innerHTML=`<span class="eyebrow">Caso a usar</span><span class="name">${esc(c.name)}</span><p class="quote" id="caseQuote">«${esc(c.say)}»</p><div><button type="button" class="btn" id="copyCase">Copiar frase</button></div>`;
   $("#copyCase").onclick=()=>copyText(c.say,$("#caseQuote"))};
  sel.addEventListener("change",show);show()},
 7(){const sels=[...document.querySelectorAll(".piece select")],ta=$("#msgOut"),bar=$("#wBar"),cnt=$("#wCount");
  const build=()=>{ta.value="Hola [Nombre], "+sels.map(s=>PIECES[s.dataset.k][s.value]).join(" ").replace(/^./,c=>c.toLowerCase());count()};
  const count=()=>{const n=(ta.value.trim().match(/\S+/g)||[]).length;cnt.textContent=n+" palabras"+(n>80?" · recorta":" · ideal < 80");bar.querySelector("i").style.width=Math.min(100,n/100*100)+"%";bar.classList.toggle("over",n>80)};
  sels.forEach(s=>s.addEventListener("change",build));ta.addEventListener("input",count);
  $("#copyMsg").onclick=()=>copyText(ta.value,ta);$("#resetMsg").onclick=build;build()},
 8(){const boxes=[...document.querySelectorAll("#check input")],v=$("#verdict");
  const upd=()=>{const n=boxes.filter(b=>b.checked).length;
   if(n===3){v.className="verdict go";v.textContent="3 de 3: agenda la reunión con Enrique."}
   else if(n===2){v.className="verdict mid";v.textContent="2 de 3: agenda y anota lo que falta para que Enrique lo sepa."}
   else{v.className="verdict no";v.textContent=n+" de 3: todavía no. Sigue la secuencia o avisa a tu líder."}};
  boxes.forEach(b=>b.addEventListener("change",upd));upd();
  const list=$("#objList"),out=$("#objOut");
  const show=i=>{const o=OBJ[i];out.innerHTML=`<div class="bubble">«${esc(o[0])}»</div><button type="button" class="btn" id="revealBtn">Revelar respuesta</button><div class="reveal" id="revealBox" hidden><span class="lbl">Lo que realmente significa</span><p>${esc(o[1])}</p><span class="lbl">Qué responder</span><p class="answer">«${esc(o[2])}»</p></div>`;
   $("#revealBtn").onclick=e=>{$("#revealBox").hidden=false;e.target.hidden=true};
   list.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.i===i))};
  list.addEventListener("click",e=>{const b=e.target.closest("button");if(b)show(+b.dataset.i)});show(0)},
 9(){const box=$("#quiz");let i=0,res=[];
  const render=()=>{
   const prog=`<div class="qprog">${QUIZ.map((_,k)=>`<i class="${res[k]===true?"r":res[k]===false?"w":""}"></i>`).join("")}</div>`;
   if(i>=QUIZ.length){const sc=res.filter(Boolean).length,ok=sc>=8;
    box.innerHTML=`<div class="q">${prog}<span class="score" style="color:${ok?"var(--cyan)":"var(--magenta)"}">${sc}/10</span><h3>${ok?"Aprobado. Listo para tus primeros llamados.":"Aún no. Repasa las vueltas donde fallaste y vuelve a intentarlo."}</h3><div><button type="button" class="btn primary" id="qAgain">Intentar de nuevo</button></div></div>`;
    $("#qAgain").onclick=()=>{i=0;res=[];render()};
    if(ok&&!state.done.includes(9)){state.done.push(9);save();paintProgress()}return}
   const q=QUIZ[i];
   box.innerHTML=`<div class="q">${prog}<span class="qn">Pregunta ${i+1} de 10</span><h3>${esc(q[0])}</h3><div class="opts">${q[1].map((o,k)=>`<button type="button" class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div><p id="qExp" hidden></p><div><button type="button" class="btn primary" id="qNext" hidden>${i===9?"Ver resultado":"Siguiente"}</button></div></div>`;
   box.querySelector(".opts").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b||b.disabled)return;const k=+b.dataset.k,right=k===q[2];res[i]=right;
    box.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.k===q[2])x.classList.add("right")});if(!right)b.classList.add("wrong");
    const ex=$("#qExp");ex.hidden=false;ex.innerHTML=`<b style="color:${right?"var(--cyan)":"var(--magenta)"}">${right?"Correcto.":"No exactamente."}</b> ${esc(q[3])}`;
    const n=$("#qNext");n.hidden=false;n.focus();n.onclick=()=>{i++;render()}})};
  render()}
};

/* ---------- navegación ---------- */
function paintProgress(){
 $("#lights").innerHTML=LAPS.map((_,k)=>`<span class="light ${state.done.includes(k)?"on":""} ${k===9?"last":""}" title="Vuelta ${k+1}"></span>`).join("")+`<span class="lap-count">${state.done.length}/10</span>`;
 document.querySelectorAll(".tab").forEach((t,k)=>t.classList.toggle("done",state.done.includes(k)));
 const f=$("#finishMsg");if(f)f.textContent=state.done.includes(state.cur)?"Vuelta completada. La luz quedó encendida.":"Marca la vuelta cuando la termines: se enciende una luz del semáforo.";
 const b=$("#doneBtn");if(b)b.textContent=state.done.includes(state.cur)?(state.cur<9?"Siguiente vuelta":"Vuelta completada"):(state.cur===9?"Completa el quiz para cerrar":"Vuelta completada");
}
function go(k,push){
 state.cur=k;save();
 document.querySelectorAll(".tab").forEach((t,j)=>t.setAttribute("aria-selected",j===k));
 const L=LAPS[k];
 $("#main").innerHTML=`<section class="lap" role="tabpanel" aria-labelledby="tab-${k}"><div class="lap-head"><span class="eyebrow">${L.eyebrow}</span><h2>${L.t}</h2></div>${VIEWS[k]()}<div class="finish"><span class="msg" id="finishMsg"></span><button type="button" class="btn primary" id="doneBtn"></button></div></section>`;
 if(MOUNT[k])MOUNT[k]();
 $("#doneBtn").onclick=()=>{
  if(k===9){if(!state.done.includes(9)){toast("Aprueba el quiz con 8 o más");$("#quiz").scrollIntoView({behavior:"smooth",block:"center"})}return}
  if(!state.done.includes(k)){state.done.push(k);save();paintProgress();toast("Vuelta "+(k+1)+" completada")}
  else go(Math.min(9,k+1),true)};
 paintProgress();
 if(push){try{history.replaceState(null,"","#vuelta-"+(k+1))}catch(e){}window.scrollTo({top:0})}
 const t=document.getElementById("tab-"+k);if(t&&t.scrollIntoView)t.scrollIntoView({block:"nearest",inline:"center"});
}
$("#tabs").innerHTML=LAPS.map((l,k)=>`<button type="button" class="tab" role="tab" id="tab-${k}" aria-selected="false"><span class="n">${String(k+1).padStart(2,"0")}</span>${l.t}</button>`).join("");
$("#tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(b)go(+b.id.split("-")[1],true)});
function fromHash(){const m=/^#vuelta-(\d+)$/.exec(location.hash);return m?Math.min(9,Math.max(0,+m[1]-1)):null}
window.addEventListener("hashchange",()=>{const h=fromHash();if(h!==null&&h!==state.cur)go(h,false)});
const h=fromHash();go(h!==null?h:(state.cur||0),false);
</script>

</body></html>
