<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Red de Negocios ACTI · MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7FB; --surface:#FFFFFF; --ink:#251762; --muted:#5A5E8A; --line:#E6E7F1; --soft:#EEEFF8;
  --teal:#62E0D8; --tink:#1FA39B; --navy:#251762; --side:#251762; --field:#FFFFFF;
  --warn:#B45309; --warnbg:#FEF3C7; --ok:#0F766E; --okbg:#D9F7F4; --bad:#B91C1C; --badbg:#FEE2E2;
  --shadow:0 2px 14px rgba(37,23,98,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#120A33; --surface:#1E1352; --ink:#FFFFFF; --muted:#C9C6E6; --line:#33276F; --soft:#2A1E66;
  --tink:#62E0D8; --side:#0E0828; --field:#170E44; --warn:#FCD34D; --warnbg:#3B2A06; --ok:#62E0D8; --okbg:#0E3B3A; --bad:#FCA5A5; --badbg:#3F1111;
  --shadow:0 2px 14px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{
  --bg:#120A33; --surface:#1E1352; --ink:#FFFFFF; --muted:#C9C6E6; --line:#33276F; --soft:#2A1E66;
  --tink:#62E0D8; --side:#0E0828; --field:#170E44; --warn:#FCD34D; --warnbg:#3B2A06; --ok:#62E0D8; --okbg:#0E3B3A; --bad:#FCA5A5; --badbg:#3F1111;
  --shadow:0 2px 14px rgba(0,0,0,.25);}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,"Helvetica Neue",Arial,sans-serif;font-size:14px;font-weight:500;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tink);outline-offset:2px}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--side);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;height:100dvh}
.brand{display:flex;flex-direction:column;gap:10px;padding:0 8px}
.brand .acti{font-weight:800;font-size:20px;letter-spacing:.02em;line-height:1}
.brand .acti span{display:block;font-size:13px;font-weight:600;color:#C9C6E6;letter-spacing:0;margin-top:4px}
.brand .pw{display:flex;align-items:center;gap:8px;font-size:11px;color:#C9C6E6}
.brand .pw img{height:16px;width:auto}
nav.menu{display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:transparent;color:#DCD9F2;font-size:13px;font-weight:600;cursor:pointer;text-align:left;width:100%}
.nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.nav.on{background:rgba(98,224,216,.14);color:#62E0D8}
.nav .badge{margin-left:auto;background:#62E0D8;color:#251762;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:800}
.side .foot{margin-top:auto;font-size:12px;color:#C9C6E6;padding:0 8px;display:flex;flex-direction:column;gap:10px}
.side .foot button{background:transparent;border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer;text-align:left}
/* top */
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 28px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.who{display:flex;align-items:center;gap:12px}
.av{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--ink);flex:none}
.who b{display:block;font-size:13.5px;font-weight:700}
.who small{color:var(--muted);font-size:12px}
.meter{display:flex;align-items:center;gap:12px;font-size:12.5px;font-weight:600}
.bar{width:160px;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--tink);border-radius:99px}
.plan{font-size:11.5px;font-weight:700;background:var(--navy);color:#fff;border-radius:999px;padding:4px 10px}
:root[data-theme="dark"] .plan{background:#62E0D8;color:#251762}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .plan{background:#62E0D8;color:#251762}}
.content{padding:24px 28px 48px;max-width:1440px;width:100%}
.demo{font-size:12px;color:var(--muted);margin-bottom:18px}
h1{font-size:24px;font-weight:800;letter-spacing:-.01em;margin:0 0 4px;line-height:1.2}
.lead{color:var(--muted);margin:0 0 20px;max-width:80ch;font-size:14.5px}
h2{font-size:16px;font-weight:700;margin:0 0 12px}
h3{font-size:14px;font-weight:700;margin:0 0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{border-top:4px solid var(--teal)}
.stat .v{font-size:24px;font-weight:800;line-height:1.1}
.stat .l{font-size:13px;font-weight:600;margin-top:4px}
.stat .b{font-size:12px;color:var(--muted);margin-top:2px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff;white-space:nowrap}
:root[data-theme="dark"] .btn{background:#62E0D8;color:#251762}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{background:#62E0D8;color:#251762}}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .chip.on{background:#62E0D8;border-color:#62E0D8;color:#251762}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.on{background:#62E0D8;border-color:#62E0D8;color:#251762}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;background:var(--soft);color:var(--ink);white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.bad{background:var(--badbg);color:var(--bad)}
.tag.navy{background:var(--navy);color:#fff}
.note{border-left:3px solid var(--teal);padding:6px 0 6px 14px;font-size:13px;color:var(--muted)}
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;background:var(--okbg);border-radius:12px;padding:12px 16px;font-size:13.5px}
.banner.warn{background:var(--warnbg)}
.banner b{font-weight:700}
/* search */
.search{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
.filters{position:sticky;top:16px;max-height:calc(100dvh - 32px);overflow:auto}
.fg+.fg{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.fg h3{display:flex;justify-content:space-between;align-items:center}
.fg h3 small{font-weight:700;color:var(--muted);font-size:11px}
.ftitle{font-size:12px;font-weight:800;color:var(--tink);margin:0 0 10px}
input[type=text],input[type=search],textarea,select{width:100%;font:inherit;font-size:13.5px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:90px;resize:vertical}
.fl{display:flex;flex-direction:column;align-items:flex-start;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
label.fl{align-items:stretch}
.fl{font-size:12.5px;font-weight:600}
.check{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;padding:3px 0;cursor:pointer}
.check input{accent-color:#1FA39B;width:16px;height:16px}
.results-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.co{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:16px;align-items:start;padding:18px 20px}
.co+.co{border-top:1px solid var(--line)}
.logo-co{width:44px;height:44px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:14px}
.co .nm{font-size:15px;font-weight:700}
.co .meta{font-size:13px;color:var(--muted);margin:2px 0 10px}
.prof{display:flex;flex-wrap:wrap;gap:6px}
.prof .p{font-size:11.5px;font-weight:600;border:1px dashed var(--line);border-radius:8px;padding:4px 8px;background:var(--bg)}
.prof .p.match{border-style:solid;border-color:var(--tink);color:var(--tink)}
.co .side-actions{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.empty{padding:40px;text-align:center;color:var(--muted)}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{background:var(--soft);font-size:12px;font-weight:700}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tfoot td{font-weight:800;background:var(--soft);border-bottom:0}
/* kanban */
.kb{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.col h3{font-size:13px;display:flex;justify-content:space-between}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px}
.kc b{display:block;font-size:13px;font-weight:700}
/* meetings */
.mt{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.mt:hover{border-color:var(--tink)}
.date{width:54px;border-radius:10px;background:var(--soft);text-align:center;padding:6px 0;line-height:1.1}
.date b{display:block;font-size:18px;font-weight:800}
.date small{font-size:10.5px;font-weight:800;color:var(--muted)}
.score{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:24px;flex:none}
.bant{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bant div{border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px}
.bant b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
ul.lst{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
ul.lst li{position:relative;padding-left:20px}
ul.lst li::before{content:"▸";color:var(--tink);font-weight:800;position:absolute;left:0;top:0}
.quote{border-left:3px solid var(--teal);padding:4px 0 4px 14px;font-size:14px}
.quote small{display:block;color:var(--muted);font-weight:700;font-size:12px;margin-bottom:2px}
.talk{height:12px;border-radius:99px;overflow:hidden;display:flex;background:var(--soft)}
.talk i{background:var(--navy)}
:root[data-theme="dark"] .talk i{background:#62E0D8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .talk i{background:#62E0D8}}
.stars{display:flex;gap:4px}
.stars button{border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--muted);opacity:.35;padding:0 2px;line-height:1}
.stars button.on{color:#E8A33D;opacity:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--navy);color:#fff}
:root[data-theme="dark"] .seg button.on{background:#62E0D8;color:#251762}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{background:#62E0D8;color:#251762}}
/* events */
.ev{display:flex;flex-direction:column;gap:12px;padding:0;overflow:hidden}
.ev .hd{background:var(--navy);color:#fff;padding:18px 20px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.ev .hd .d{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 10px;text-align:center;line-height:1.05;min-width:58px}
.ev .hd .d b{display:block;font-size:18px}
.ev .hd .d small{font-size:11px;font-weight:800;color:#62E0D8}
.ev .hd h3{font-size:14.5px;color:#fff;margin:0}
.ev .hd p{margin:2px 0 0;font-size:12.5px;color:#C9C6E6}
.ev .bd{padding:0 20px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.prog{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--tink)}
.att{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.att:last-child{border-bottom:0}
.news{display:flex;flex-direction:column;gap:14px}
.news div{border-left:3px solid var(--teal);padding-left:12px;font-size:13px}
.news small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slots button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 0;font-weight:800;font-size:13px;cursor:pointer;color:var(--ink)}
.slots button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.slots button[disabled]{opacity:.35;cursor:not-allowed;text-decoration:line-through}
/* modal / drawer */
.ov{position:fixed;inset:0;background:rgba(14,8,40,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.ov.on{display:flex}
.modal{background:var(--surface);border-radius:16px;max-width:540px;width:100%;max-height:calc(100dvh - 40px);overflow:auto;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal.wide{max-width:920px}
.mhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}
.x{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;flex:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#251762;color:#fff;border-radius:12px;padding:11px 16px;font-size:13px;font-weight:600;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 12px;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--tink)}
.pairs{display:flex;flex-direction:column;gap:10px}
.pair{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:start}
.prog-ring{display:flex;align-items:center;gap:14px}

.db{display:grid;grid-template-columns:256px minmax(0,1fr);gap:18px;align-items:start}
.dbf{padding:14px;position:sticky;top:16px;max-height:calc(100dvh - 32px);overflow:auto}
.dbf .ftitle{margin:8px 4px 4px}
.facet{border-bottom:1px solid var(--line)}
.facet summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:9px 4px;font-size:13px;font-weight:700}
.facet summary::-webkit-details-marker{display:none}
.facet summary::after{content:"+";margin-left:auto;color:var(--tink);font-size:18px;line-height:1}
.facet[open] summary::after{content:"−"}
.fsel{background:var(--tink);color:#fff;border-radius:999px;font-size:11px;padding:0 7px}
.fopts{display:flex;flex-direction:column;gap:2px;padding:0 4px 10px;max-height:220px;overflow:auto}
.fopt{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px;padding:4px 0;cursor:pointer}
.fopt input{accent-color:#1FA39B;width:15px;height:15px;margin:0}
.fopt em{font-style:normal;font-size:12px;color:var(--muted);font-weight:700}
.linkbtn{border:0;background:transparent;color:var(--tink);font-weight:800;font-size:13px;cursor:pointer;padding:0}
.dbt td{padding:10px 8px}
.dbt th{padding:10px}
.dbt td:nth-child(3){min-width:150px}
.dbt th{white-space:nowrap}
.dbrow{cursor:pointer}
.dbrow:hover td{background:var(--soft)}
.logo-co.sm{width:34px;height:34px;font-size:12px;border-radius:8px;flex:none}
.cn{font-size:13.5px;font-weight:700}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:32px;cursor:pointer;font-size:16px;color:var(--muted)}
.ib.on{color:#E8A33D;border-color:#E8A33D}
.fit{display:inline-block;min-width:46px;text-align:center;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:800}
.fit.hi{background:var(--okbg);color:var(--ok)}.fit.md{background:var(--warnbg);color:var(--warn)}.fit.lo{background:var(--soft);color:var(--muted)}
.sm-chip{padding:4px 10px;font-size:12px}
.iahead{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;border-top:4px solid var(--teal)}
.iahead>div:first-child{max-width:640px}
.rec{display:flex;flex-direction:column;gap:14px}
.rec .why{background:var(--bg);border-radius:12px;padding:12px 14px;flex:1}
.fitbig{font-size:22px;font-weight:800;color:var(--tink);line-height:1}
.coact .btn{flex:none}
.rec .coact{justify-content:flex-start!important}
.secn{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
:root[data-theme="dark"] .secn{background:#62E0D8;color:#251762}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .secn{background:#62E0D8;color:#251762}}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--soft);border-top-color:var(--tink);margin:0 auto;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
@media (max-width:1100px){.db{grid-template-columns:minmax(0,1fr)}.dbf{position:static;max-height:none}}

.pw-badge{font-size:11.5px;font-weight:700;color:var(--tink);border:1px solid var(--tink);border-radius:999px;padding:4px 10px}
.ptabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin:18px 0 22px;overflow-x:auto}
.ptabs button{border:0;background:transparent;padding:10px 2px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.ptabs button.on{color:var(--ink);border-bottom-color:var(--teal)}
.pwrap{display:flex;flex-direction:column;gap:20px}
.pgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.pgrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.plab{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.ptxt{font-size:13.5px;line-height:1.6;color:var(--ink);margin:14px 0 0}
.pbar{flex:1;height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#251762,#62E0D8)}
.pnum{font-size:13px;color:var(--muted)}.pnum b{font-size:24px;color:var(--ink);font-weight:800}
.ppill{display:inline-block;border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px}
.ppill.ok,.cs.ok{background:var(--okbg);color:var(--ok)}.ppill.warn,.cs.warn{background:var(--warnbg);color:var(--warn)}.ppill.bad,.cs.bad{background:var(--badbg);color:var(--bad)}
.ph{font-size:15px;font-weight:700;margin:0 0 14px}
.crit{display:grid;grid-template-columns:200px 36px minmax(0,1fr);gap:16px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:16px}
.crit b{font-size:13.5px;font-weight:700}
.cs{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:800}
.mej{border:1px solid var(--line);border-radius:12px;padding:18px}
.mej h4,.dolor h4,.pend h4,.rec2 h4{font-size:14px;font-weight:700;margin:10px 0 6px}
.dolor h4,.rec2 h4,.pend h4{margin-top:0}
.bolt{width:34px;height:34px;border-radius:8px;background:var(--soft);display:grid;place-items:center}
.bolt svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.dolor{display:flex;gap:12px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--bg)}
.dot{width:10px;height:10px;border-radius:50%;background:#C0392B;flex:none;margin-top:6px}
.commit{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:13.5px}
.commit input{width:20px;height:20px;accent-color:#1FA39B;flex:none}
.commit .done{text-decoration:line-through;color:var(--muted)}
.pend{border:1px solid var(--line);border-radius:12px;padding:16px}
.sug{margin:8px 0 0;border-left:3px solid var(--teal);padding-left:12px;font-size:13px;color:var(--muted)}
.sug b{color:var(--tink)}
.rec2{display:flex;gap:14px;border:1px solid var(--line);border-radius:12px;padding:16px}
.num{width:30px;height:30px;border-radius:50%;background:#251762;color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
:root[data-theme="dark"] .num{background:#62E0D8;color:#251762}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .num{background:#62E0D8;color:#251762}}
.tline{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tline:last-child{border-bottom:0}
.ts{font-size:12px;font-weight:800;color:var(--muted);padding-top:2px}
.crit .ptxt,.mej .ptxt,.dolor .ptxt,.rec2 .ptxt{color:var(--muted)}
.tline b.us{color:var(--tink)}.tline b.them{color:var(--ink)}
@media (max-width:1000px){.pgrid2,.pgrid3{grid-template-columns:minmax(0,1fr)}.crit{grid-template-columns:minmax(0,1fr) 36px}.crit p{grid-column:1/-1}}
.plancard{display:flex;flex-direction:column;gap:8px}
.plancard.cur{border:2px solid var(--tink)}
.pp{font-size:26px;font-weight:800;line-height:1.1;margin-top:6px}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
@media (max-width:1100px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.search{grid-template-columns:minmax(0,1fr)}.filters{position:static;max-height:none}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;align-items:center;padding:12px 16px;gap:16px;overflow-x:auto;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .brand .pw{display:none}
  nav.menu{flex-direction:row}
  .nav{white-space:nowrap;padding:8px 10px}
  .nav svg{display:none}
  .side .foot{display:none}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .top,.content{padding-left:18px;padding-right:18px}
  .bant{grid-template-columns:repeat(2,1fr)}
  .co{grid-template-columns:44px minmax(0,1fr)}
  .co .side-actions{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:center;min-width:0}
  .co .side-actions .row{justify-content:flex-start!important}
  .co>div{min-width:0}
  .pair{grid-template-columns:1fr}
}
@media (max-width:560px){.grid4{grid-template-columns:minmax(0,1fr)}.bar{width:100px}.slots{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

var FKEYS=["ind","country","city","size","rev","tech","sig","src","area","sen","cargo"];
function emptyF(){return {q:"",ind:[],country:[],city:[],size:[],rev:[],tech:[],sig:[],src:[],area:[],sen:[],cargo:[]}}
function val(c,k){switch(k){case "ind":return [c.ind];case "country":return [c.country];case "city":return [c.city];case "size":return [String(c.size)];case "rev":return [String(c.rev)];case "tech":return c.tech;case "sig":return c.sig;case "src":return [c.ext?"Extendida":"BullsEye"];case "area":return c.cargos.map(function(i){return CARGOS[i][1]});case "sen":return c.cargos.map(function(i){return CARGOS[i][2]});case "cargo":return c.cargos.map(function(i){return CARGOS[i][0]})}}
function passes(c,f,skip){
  if(f.q&&(c.name+" "+c.domain).toLowerCase().indexOf(f.q.toLowerCase())<0)return false;
  for(var i=0;i<FKEYS.length;i++){var k=FKEYS[i];if(k===skip||!f[k].length)continue;if(k==="area"||k==="sen"||k==="cargo")continue;var v=val(c,k);if(!f[k].some(function(x){return v.indexOf(x)>=0}))return false}
  if(skip!=="persona"&&(f.area.length||f.sen.length||f.cargo.length)&&!matches(c,f).length)return false;
  return true;
}
function matches(c,f){f=f||S.filters;return c.cargos.filter(function(i){var g=CARGOS[i];
  if(f.area.length&&f.area.indexOf(g[1])<0)return false;if(f.sen.length&&f.sen.indexOf(g[2])<0)return false;if(f.cargo.length&&f.cargo.indexOf(g[0])<0)return false;return true})}
function filtered(){var r=CO.filter(function(c){return passes(c,S.filters)&&!S.dismissed[c.id]});
  var so=S.sort||"fit";r.sort(function(a,b){if(so==="name")return a.name.localeCompare(b.name,"es");if(so==="emp")return b.emp-a.emp;return fit(b).score-fit(a).score});return r}
function facet(key,title,opts,labels,open){
  var f=S.filters, sel=f[key].length;
  var rows=opts.map(function(o,i){var tmp=JSON.parse(JSON.stringify(f));if(key!=="area"&&key!=="sen"&&key!=="cargo")tmp[key]=[];
    var cnt=CO.filter(function(c){if(S.dismissed[c.id])return false;if(key==="area"||key==="sen"||key==="cargo"){var t2=JSON.parse(JSON.stringify(f));t2[key]=[o];return passes(c,t2,null)&&matches(c,t2).length}return passes(c,tmp,key)&&val(c,key).indexOf(o)>=0}).length;
    var on=f[key].indexOf(o)>=0;
    return '<label class="fopt"><input type="checkbox" data-fk="'+key+'" data-fv="'+esc(o)+'"'+(on?' checked':'')+'><span>'+esc(labels?labels[i]:o)+'</span><em>'+cnt+'</em></label>'}).join("");
  return '<details class="facet"'+(open||sel?' open':'')+'><summary>'+title+(sel?'<span class="fsel">'+sel+'</span>':'')+'</summary><div class="fopts">'+rows+'</div></details>';
}

/* ---------- IA (simulada en el MVP) ---------- */
function fit(c){
  var I=S.icp, sc=0, rs=[], warn=[];
  if(I.ind.indexOf(c.ind)>=0){sc+=28;rs.push("Está en <b>"+c.ind.toLowerCase()+"</b>, una de tus industrias objetivo.")}
  if(I.country.indexOf(c.country)>=0)sc+=8;
  if(I.size.indexOf(String(c.size))>=0){sc+=14;rs.push("Tiene <b>"+fmt(c.emp)+" empleados</b>, dentro del tamaño que definiste.")}
  var tm=c.tech.filter(function(t){return I.tech.indexOf(t)>=0});if(tm.length){sc+=Math.min(14,tm.length*8);rs.push("Usa <b>"+tm.join(" y ")+"</b>, tecnologías donde tu servicio aplica.")}
  var sm=c.sig.filter(function(s){return I.sig.indexOf(s)>=0});if(sm.length){sc+=Math.min(22,sm.length*12);rs.push("Señal de compra: <b>"+sm.join(", ").toLowerCase()+"</b>.")}
  var pm=c.cargos.filter(function(i){return I.personas.some(function(p){return p.cargo===CARGOS[i][0]})});
  if(pm.length){sc+=12;rs.push("Tenemos acceso a <b>"+pm.map(function(i){return CARGOS[i][0]}).join(", ")+"</b>, tu buyer persona.")}
  var look=I.refs.filter(function(r){var rc=CO.filter(function(x){return x.name===r})[0];return rc&&rc.id!==c.id&&rc.ind===c.ind&&Math.abs(rc.size-c.size)<=1});
  if(look.length){sc+=8;rs.push("Se parece a <b>"+look[0]+"</b>, uno de tus clientes de referencia.")}
  if(c.demand>=4){sc-=8;warn.push("Otros "+c.demand+" socios la pidieron este mes: la prospección puede tardar más.")}
  if(I.excl.some(function(e){return e&&c.name.toLowerCase()===e.toLowerCase()})||I.exInd.indexOf(c.ind)>=0)sc=0;
  return {score:Math.max(0,Math.min(98,sc)),reasons:rs.length?rs:["Calce bajo con tu ICP actual."],warn:warn,persona:pm.length>0};
}

   (my.length?'<h3>Mis reuniones en este evento</h3>'+my.map(function(x){var a=att.filter(function(y){return y[0]===x.att})[0];return '<div class="kc"><b>'+x.slot+' · '+a[1]+'</b><span class="muted">'+a[2]+'</span> <span class="tag '+(x.st==="Confirmada"?'ok':'warn')+'">'+x.st+'</span></div>'}).join(""):'')+
  '</div></div></div>'+
  '<section class="card"><div class="between" style="flex-wrap:wrap"><h2 style="margin:0">Asistentes ('+att.length+')</h2><select id="attF" style="max-width:260px" aria-label="Filtrar asistentes por industria"><option value="">Todas las industrias</option>'+Array.from(new Set(att.map(function(a){return a[3]}))).map(function(i){return '<option'+(af===i?' selected':'')+'>'+i+'</option>'}).join("")+'</select></div>'+
  (!reg?'<div class="banner warn" style="margin-top:14px"><div>Inscríbete para agendar reuniones con los asistentes.</div></div>':'')+
  (!e.net?'<div class="note" style="margin-top:14px">Este evento no tiene ronda de reuniones uno a uno. Puedes ver quién asiste y solicitar una reunión posterior a través de Buscar cuentas.</div>':'')+
  '<div style="margin-top:8px">'+shown.map(function(a){var has=S.evMeet.filter(function(x){return x.ev===e.id&&x.att===a[0]})[0];
    return '<div class="att"><div class="logo-co" style="width:44px;height:44px;font-size:14px">'+ini(a[1])+'</div><div><b>'+a[1]+'</b><div class="small muted">'+a[2]+' · '+a[3]+'</div><div style="margin-top:4px"><span class="tag'+(a[4]==="Socio ACTI"?' navy':'')+'">'+a[4]+'</span>'+(a[5]?'':' <span class="tag">No recibe reuniones</span>')+'</div></div>'+
    (has?'<span class="tag '+(has.st==="Confirmada"?'ok':'warn')+'">'+has.slot+' · '+has.st+'</span>':'<button class="btn sm" data-evreq="'+a[0]+'" '+(!reg||!a[5]||!e.net?'disabled':'')+'>Agendar reunión</button>')+'</div>'}).join("")+'</div>'+
  '<p class="note" style="margin-top:12px">Por privacidad mostramos empresa y cargo. Los asistentes deciden si reciben reuniones y confirman cada solicitud. Las reuniones de eventos no consumen tu cupo mensual.</p></section>';
}
function openEvReq(aid){
  var e=EVENTS.filter(function(x){return x.id===S.evId})[0], a=ATT[e.id].filter(function(x){return x[0]===aid})[0];
  var taken=S.evMeet.filter(function(x){return x.ev===e.id}).map(function(x){return x.slot});

  '<div class="stack"><div class="fl">Elige un horario de la ronda de reuniones<div class="slots">'+e.slots.map(function(s){return '<button type="button" data-slot="'+s+'" '+(taken.indexOf(s)>=0?'disabled title="Ya tienes una reunión en este horario"':'')+'>'+s+'</button>'}).join("")+'</div></div>'+
  '<label class="fl">Mensaje para el asistente<textarea id="evMsg">Hola, somos Nube Segura, socios de ACTI. Nos encantaría conversar 15 minutos sobre seguridad en la nube para '+a[3].toLowerCase()+'.</textarea></label>'+
  '<div class="note">El asistente recibe la solicitud y la confirma. Te avisaremos por correo y aquí mismo.</div>'+

function vFactFree(){
  return '<h1>Facturación</h1><p class="lead">Tu plan Freemium está incluido en tu membresía de ACTI. Las reuniones de prueba no tienen costo.</p>'+
  '<div class="grid4">'+stat("$0","Este mes","Incluido en la membresía ACTI")+stat(meetYear()+' de 2',"Reuniones de prueba","Sin costo")+stat(S.used+' de 20',"Empresas prospectadas","En tu prueba")+stat(TRIAL.days,"Días de prueba","Vence el "+TRIAL.end)+'</div>'+
  '<section class="card" style="margin-top:20px"><div class="between" style="flex-wrap:wrap"><div><h2 style="margin:0 0 4px">¿Quieres reuniones todos los meses?</h2><p class="small muted" style="margin:0">Los planes pagados garantizan entre 5 y 12 reuniones al mes, con una base mensual y 4 UF por reunión agendada.</p></div><button class="btn" data-go="planes">Ver planes</button></div></section>';
}
function vFacturacion(){
  if(isFree())return vFactFree();
  var t=S.btab||"feb";
  var rea=MEET.filter(function(m){return m.mon==="FEB"&&m.st==="realizada"}), ns=MEET.filter(function(m){return m.mon==="FEB"&&m.st==="noshow"}), ag=MEET.filter(function(m){return m.st==="agendada"});
  var rows, cupo=PLAN.fee, n, title, status;
  if(t==="feb"){n=rea.length;rows=rea.map(function(m){return [m.day+" feb",CO[m.co].name,m.cargo,S.feedback[m.id]&&S.feedback[m.id].done?'<span class="tag ok">Confirmada</span>':'<span class="tag warn">Feedback pendiente</span>',PLAN.variable]}).concat(ns.map(function(m){return [m.day+" feb",CO[m.co].name,m.cargo,'<span class="tag bad">No asistió · sin cargo</span>',0]}));title="Febrero 2027";status='<span class="tag warn">En curso · cierra el 28 feb</span>';}
  else{n=Math.min(4,PLAN.garant);rows=JAN.slice(0,n).map(function(j){return [j[0],j[1],j[2],'<span class="tag ok">Confirmada</span>',PLAN.variable]});title="Enero 2027";status='<span class="tag ok">Pagada</span>';}
  var vari=n*PLAN.variable, sub=cupo+vari, iva=sub*IVA, tot=sub+iva;
  return '<h1>Facturación</h1><p class="lead">Pagas la base mensual de tu plan y '+fmt(PLAN.variable,1)+' UF por cada reunión realizada. Las reuniones a las que el prospecto no asiste no se cobran.</p>'+
  '<div class="tabs" role="tablist">'+[["feb","Febrero 2027"],["ene","Enero 2027"]].map(function(x){return '<button role="tab" aria-selected="'+(t===x[0])+'" class="'+(t===x[0]?'on':'')+'" data-btab="'+x[0]+'">'+x[1]+'</button>'}).join("")+'</div>'+
  '<div class="between" style="margin-bottom:16px;flex-wrap:wrap"><h2 style="margin:0">'+title+'</h2>'+status+'</div>'+
  '<div class="grid4">'+stat(fmt(cupo,1)+' UF',"Base Plan "+PLAN.name,PLAN.garant+" reuniones garantizadas")+stat(n,"Reuniones realizadas",fmt(PLAN.variable,1)+" UF cada una")+stat(fmt(vari,1)+' UF',"Variable del mes",n+" × "+fmt(PLAN.variable,1)+" UF")+stat(fmt(sub,1)+' UF',"Subtotal neto","$"+fmt(Math.round(sub*UF))+" + IVA")+'</div>'+
  '<div class="grid2" style="margin-top:20px;grid-template-columns:minmax(0,2fr) minmax(0,1fr)"><section class="card"><h2>Detalle de reuniones</h2><div class="tw"><table><thead><tr><th>Fecha</th><th>Empresa</th><th>Cargo</th><th>Estado</th><th class="r">Monto (UF)</th></tr></thead><tbody>'+
   rows.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td class="r">'+fmt(r[4],1)+'</td></tr>'}).join("")+'</tbody></table></div>'+
   (t==="feb"?'<p class="note" style="margin-top:14px">Quedan '+ag.length+' reuniones agendadas este mes. Si se realizan, el variable sube a '+fmt((n+ag.length)*PLAN.variable,1)+' UF.</p>':'')+'</section>'+
  '<section class="card stack"><h2>Resumen</h2><div class="between small"><span>Base Plan '+PLAN.name+'</span><b>'+fmt(cupo,1)+' UF</b></div><div class="between small"><span>Variable ('+n+' reuniones)</span><b>'+fmt(vari,1)+' UF</b></div><div class="between small"><span>IVA 19%</span><b>'+fmt(iva,2)+' UF</b></div><div class="between" style="border-top:2px solid var(--tink);padding-top:10px"><b>Total</b><b>'+fmt(tot,2)+' UF</b></div><div class="small muted">$'+fmt(Math.round(tot*UF))+' con UF de $'+fmt(UF)+'</div>'+
   '<button class="btn ghost" data-act="toast" data-msg="La descarga estará disponible en la versión final">Descargar detalle</button></section></div>'+
  '<section class="card" style="margin-top:20px"><h2>Historial</h2><div class="tw"><table><thead><tr><th>Mes</th><th class="r">Base (UF)</th><th class="r">Reuniones</th><th class="r">Total neto (UF)</th><th>Estado</th></tr></thead><tbody><tr><td>Febrero 2027</td><td class="r">'+fmt(PLAN.fee,1)+'</td><td class="r">'+rea.length+' a la fecha</td><td class="r">'+fmt(PLAN.fee+rea.length*PLAN.variable,1)+'</td><td><span class="tag warn">En curso</span></td></tr><tr><td>Enero 2027</td><td class="r">'+fmt(PLAN.fee,1)+'</td><td class="r">'+PLAN.garant+'</td><td class="r">'+fmt(PLAN.fee+PLAN.garant*PLAN.variable,1)+'</td><td><span class="tag ok">Pagada</span></td></tr></tbody></table></div></section>';
}

function vPlanes(){
  var order=["freemium","conecta","crece","acelera"];
  var FEAT={freemium:["Plataforma y todos los módulos","Eventos y networking de ACTI","Hasta 2 reuniones al año, en una prueba de 90 días","Hasta 20 empresas prospectadas al año","5 búsquedas con IA al mes","Onboarding grupal y soporte en la plataforma"]};
  function paidFeat(p){return [p.garant+" reuniones garantizadas al mes","Trabajamos las cuentas necesarias para cumplirlas","Recomendaciones con IA según tu ICP","KAM asignado","Informe de Peitho en cada reunión","Eventos y networking de ACTI"]}
  return '<h1>Mi plan</h1><p class="lead">Todo socio de ACTI parte con el plan Freemium. Cuando quieras reuniones todos los meses, eliges un plan pagado: base mensual y 4 UF por reunión agendada.</p>'+
  '<div class="grid4 plans">'+order.map(function(k){var p=PLANS[k],cur=PLAN.key===k,free=k==="freemium";
    var price=free?'<div class="pp">Incluido</div><div class="small muted">en tu membresía ACTI</div>':'<div class="pp">'+p.fee+' UF</div><div class="small muted">base + 4 UF por reunión</div>';
    var tot=free?'Sin costo':'Total '+(p.fee+p.garant*4)+' UF al mes · ≈ $'+fmt(Math.round((p.fee+p.garant*4)/p.garant*UF/1000))+' mil por reunión';
    return '<article class="card plancard'+(cur?' cur':'')+'"><div class="between"><h2 style="margin:0">'+p.name+'</h2>'+(cur?'<span class="tag ok">Tu plan</span>':(k==="crece"?'<span class="tag">Más elegido</span>':''))+'</div>'+price+
    '<div class="small" style="font-weight:700;margin:4px 0 10px">'+tot+'</div><ul class="lst small">'+(free?FEAT.freemium:paidFeat(p)).map(function(f){return '<li>'+f+'</li>'}).join("")+'</ul>'+
    '<button class="btn'+(cur?' ghost':'')+'" style="margin-top:auto;width:100%" data-setplan="'+k+'"'+(cur?' disabled':'')+'>'+(cur?'Tu plan actual':(free?'Volver a Freemium':'Cambiar a '+p.name))+'</button></article>'}).join("")+'</div>'+
  '<p class="note" style="margin-top:18px">Valores mensuales + IVA. En la demostración, al cambiar de plan la plataforma muestra la experiencia de ese plan.</p>';
}

/* ---------- render y eventos ---------- */
var VIEWS={planes:vPlanes,reunion:vReunion,inicio:vInicio,perfil:vPerfil,icp:vICP,buscar:vBuscar,solicitudes:vSolicitudes,reuniones:vReuniones,eventos:vEventos,evento:vEvento,facturacion:vFacturacion};
function render(){renderMenu();$("view").innerHTML=VIEWS[S.view]();if(S.view==="evento"){var m=document.querySelector('.nav[data-go="eventos"]');if(m)m.classList.add("on")}if(S.view==="reunion"){var m2=document.querySelector('.nav[data-go="reuniones"]');if(m2)m2.classList.add("on")}}
function modal(html,wide){var m=$("modal");m.className="modal"+(wide?" wide":"");m.innerHTML=html;$("ov").classList.add("on");m.setAttribute("tabindex","-1");setTimeout(function(){m.focus({preventScroll:true});m.scrollTop=0},30)}
function close(){$("ov").classList.remove("on")}
var tt;function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){e.classList.remove("on")},2600)}
function readProfile(){var p=S.profile;var g=function(id){var e=$(id);return e?e.value:null};
  if(g("pVp")!==null){p.vp=g("pVp");p.cases=g("pCases");p.diff=g("pDiff");p.avoid=g("pAvoid");document.querySelectorAll("[data-obj]").forEach(function(i){p.obj[+i.dataset.obj][+i.dataset.k]=i.value})}}

document.addEventListener("click",function(e){
  var t=e.target.closest("button,input,select,label,[data-meet],[data-go],[data-co]");if(!t)return;if(t.tagName==="INPUT"||t.tagName==="SELECT"||t.tagName==="LABEL")return;
  var d=t.dataset;
  if(e.target===$("ov")){close();return}
  if(d.go){close();go(d.go);return}
  if("close" in d){close();return}
  if(d.rmf){var ar=S.filters[d.rmf];ar.splice(ar.indexOf(d.rmv),1);S.page=1;render();return}
  if(d.stab){S.btabS=d.stab;render();return}
  if(d.page){S.page=+d.page;render();window.scrollTo(0,0);return}
  if(d.save){var sid=+d.save;if(S.savedCo[sid]){delete S.savedCo[sid];toast("Quitada de guardadas")}else{S.savedCo[sid]=true;toast(CO[sid].name+" guardada")}if($("ov").classList.contains("on"))openCo(sid);render();return}
  if(d.dismiss){openDismiss(+d.dismiss);return}
  if(d.dreason){S._dr=d.dreason;t.parentNode.querySelectorAll(".chip").forEach(function(b){b.classList.toggle("on",b===t)});return}
  if(d.confirmdis){S.dismissed[+d.confirmdis]=S._dr||"Sin motivo";delete S.savedCo[+d.confirmdis];close();render();toast("Descartada. No volverá a aparecer en tus recomendaciones.");return}
  if(d.icp){readICP();var ia=S.icp[d.icp],ix=ia.indexOf(d.v);if(ix>=0)ia.splice(ix,1);else ia.push(d.v);render();return}
  if(d.rmpers){readICP();S.icp.personas.splice(+d.rmpers,1);render();return}
  if(d.loads){S.filters=JSON.parse(JSON.stringify(S.searches[+d.loads].f));S.page=1;render();toast("Búsqueda cargada");return}
  if(d.req){openReq(+d.req);return}
  if(d.confirmreq){var c=+d.confirmreq;S.sol.push({co:c,cargo:$("rCargo").value,st:"cola",d:"16 feb"});S.used++;close();render();toast("Solicitud enviada: "+CO[c].name+". La verás en Mis solicitudes.");return}
  if(d.meet){openMeet(d.meet);return}
  if(d.co!==undefined&&!t.matches("button")){openCo(+d.co);return}
  if(d.mtab){S.mtab=d.mtab;render();return}
  if(d.etab){S.etab=d.etab;render();return}
  if(d.btab){S.btab=d.btab;render();return}
  if(d.ev){S.evId=d.ev;S.attF="";go("evento");return}
  if(d.reg){S.regEvents[d.reg]=true;EVENTS.forEach(function(x){if(x.id===d.reg)x.ins++});render();toast("Inscripción confirmada. Ya puedes agendar reuniones con los asistentes.");return}
  if(d.unreg){delete S.regEvents[d.unreg];EVENTS.forEach(function(x){if(x.id===d.unreg)x.ins--});S.evMeet=S.evMeet.filter(function(x){return x.ev!==d.unreg});render();toast("Cancelaste tu inscripción");return}
  if(d.evreq){openEvReq(d.evreq);return}
  if(d.slot){S._slot=d.slot;document.querySelectorAll("[data-slot]").forEach(function(b){b.classList.toggle("on",b.dataset.slot===d.slot)});return}
  if(d.confirmev){if(!S._slot){toast("Elige un horario para la reunión");return}S.evMeet.push({ev:S.evId,att:d.confirmev,slot:S._slot,st:"Pendiente de confirmación"});close();render();toast("Solicitud enviada. El asistente debe confirmarla.");return}
  if(d.repo){var s=S.sol[+d.repo];s.st="repuesta";S.sol.splice(+d.repo,1);S.repos++;render();toast("Cuenta reemplazada. La IA sumará una nueva recomendación.");return}
  if(d.star){S._fb.stars=+d.star;document.querySelectorAll("[data-star]").forEach(function(b){b.classList.toggle("on",+b.dataset.star<=+d.star)});return}
  if(d.segv){var g=t.parentNode.dataset.seg;S._fb[g]=d.segv;t.parentNode.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b===t)});return}
  if(d.setplan){setPlan(d.setplan);render();toast("Ahora ves la plataforma con el plan "+PLAN.name+".");return}
  if(d.ptab){S.ptab=d.ptab;render();return}
  if(d.savefb){if(!S._fb.stars||!S._fb.opp){toast("Califica el perfil y dinos si es una oportunidad");return}S._fb.comment=$("fbC").value;S._fb.done=true;S.feedback[d.savefb]=S._fb;S.ptab="analisis";render();toast("Gracias. Tu feedback ya está registrado.");return}
  if(d.rmserv){readProfile();S.profile.services.splice(+d.rmserv,1);render();return}
  if(d.rmobj){readProfile();S.profile.obj.splice(+d.rmobj,1);render();return}
  switch(d.act){
    case "clearf":S.filters=emptyF();S.page=1;render();break;
    case "savesearch":var nm=prompt("Nombre para esta búsqueda","Búsqueda "+(S.searches.length+1));if(nm){S.searches.push({name:nm,f:JSON.parse(JSON.stringify(S.filters))});render();toast("Búsqueda guardada")}break;
    case "runai":if(isFree()&&S.iaUsed>=5){toast("Usaste tus 5 búsquedas con IA de este mes. Se renuevan el 1 de marzo.");break}if(isFree())S.iaUsed++;S.aiLoading=true;render();setTimeout(function(){S.aiLoading=false;S.aiRan=true;render()},1400);break;
    case "undismiss":S.dismissed={};render();break;
    case "addpers":readICP();S.icp.personas.push({cargo:"CTO",rol:"Decide",pri:"Media"});render();break;
    case "saveicpf":readICP();render();toast("ICP guardado. La IA usará esta versión.");break;
    case "saveicpgo":readICP();S.btabS="ia";S.aiRan=false;go("buscar");break;
    case "addserv":readProfile();var v=$("pNewServ").value.trim();if(v){S.profile.services.push(v);render()}break;
    case "addobj":readProfile();S.profile.obj.push(["",""]);render();break;
    case "saveprof":readProfile();S.profilePct=S.profile.diff&&S.profile.avoid?100:90;render();toast("Perfil guardado. Nuestra escudería ya tiene la versión actualizada.");break;
    case "reponerAll":var k=S.sol.filter(function(s){return s.st==="sinresp"}).length;S.sol=S.sol.filter(function(s){return s.st!=="sinresp"});S.repos+=k;render();toast(k+" cuentas reemplazadas con recomendaciones de la IA.");break;
    case "toast":toast(d.msg);break;
    case "copymail":var txt="Asunto: "+$("mSubj").value+"\n\n"+$("mBody").value;try{navigator.clipboard.writeText(txt).then(function(){toast("Correo copiado")},function(){toast("Selecciona el texto y cópialo")})}catch(er){toast("Selecciona el texto y cópialo")}break;
  }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape")close();
  if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.meet){e.preventDefault();openMeet(e.target.dataset.meet)}
  if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("dbrow")){openCo(+e.target.dataset.co)}
});
$("ov").addEventListener("click",function(e){if(e.target===$("ov"))close()});
document.addEventListener("change",function(e){var t=e.target;
  if(t.dataset.fk){var a=S.filters[t.dataset.fk],i=a.indexOf(t.dataset.fv);if(t.checked&&i<0)a.push(t.dataset.fv);if(!t.checked&&i>=0)a.splice(i,1);S.page=1;var openSet=[].map.call(document.querySelectorAll("details.facet"),function(d){return d.open});render();document.querySelectorAll("details.facet").forEach(function(d,j){if(openSet[j])d.open=true})}
  if(t.id==="sortSel"){S.sort=t.value;render()}
  if(t.id==="attF"){S.attF=t.value;render()}
  if(t.dataset.commit){S.commit[t.dataset.commit]=t.checked;render()}
});
document.addEventListener("input",function(e){if(e.target.id==="q"){S.filters.q=e.target.value;S.page=1;var pos=e.target.selectionStart;render();var q=$("q");q.focus();q.setSelectionRange(pos,pos)}});

var btn=$("themeBtn"),root=document.documentElement;
function isDark(){var t=root.getAttribute("data-theme");if(t)return t==="dark";return window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches}
function lab(){btn.textContent=isDark()?"Cambiar a modo claro":"Cambiar a modo oscuro"}
try{var sv=localStorage.getItem("acti-mvp-theme");if(sv)root.setAttribute("data-theme",sv)}catch(e){}
btn.addEventListener("click",function(){var n=isDark()?"light":"dark";root.setAttribute("data-theme",n);try{localStorage.setItem("acti-mvp-theme",n)}catch(e){}lab()});
lab();S.icpPct=icpPct();render();
})();
